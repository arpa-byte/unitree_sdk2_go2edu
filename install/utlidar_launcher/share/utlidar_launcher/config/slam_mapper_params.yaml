slam_toolbox:
  ros__parameters:
    odom_frame: "odom"
    map_frame: "map"
    base_frame: "base_link"
    scan_topic: "/scan_reliable" # Make sure this is using the reliable topic
    
    # --- THIS IS THE CRITICAL FIX ---
    # Tells SLAM to keep 20 seconds of transform history.
    # This creates a large window to find a match for incoming sensor data.
    tf-buffer-duration: 30.0
        
    mode: "mapping"
    map_update_interval: 1.0
    resolution: 0.05
    max_laser_range: 10.0
    use_scan_matching: true
    minimum_travel_distance: 0.05 # Keep this sensitive value