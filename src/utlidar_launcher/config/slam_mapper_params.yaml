slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: "odom"
    map_frame:  "map"
    base_frame: "base_link"
    scan_topic: "/scan_reliable"

    # Keep a generous TF history window (seconds)
    tf_buffer_duration: 30.0
    transform_timeout: 1.0

    # LiDAR specifics
    min_laser_range: 0.2
    max_laser_range: 10.0

    #mode: "mapping"
    mode: "mapping"
    map_file_name: ""
    map_update_interval: 1.0
    resolution: 0.03  #meters per cell
    minimum_travel_distance: 0.05


    # --- Extremely conservative / aggressive filters (debugging mode) ---
    use_scan_matching: true               # keep enabled but make it tiny
    use_scan_barycenter: true
    minimum_scan_barycenter_change: 10.0  # require huge barycenter change before accepting scans
    loop_match_minimum_response_fine: 0.999   # almost impossible to accept loop matches
    loop_search_maximum_distance: 0.05    # extremely small search radius for loop detection
    solver_search_radius: 0.01           # extremely tight solver radius
    transform_publish_period: 0.2       # publish transforms much less often (if you prefer)
    
    # reduce optimizer aggressiveness
    optimize_every_n_nodes: 0            # disable periodic optimization (avoid large jumps)
    max_history_seconds: 1.0             # very small history kept
    # (optional) disable loop closures entirely (comment out if you want loop closures)
    enable_loop_closure: false