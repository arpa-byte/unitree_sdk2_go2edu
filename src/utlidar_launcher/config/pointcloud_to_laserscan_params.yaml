pointcloud_to_laserscan_node:
  ros__parameters:
    use_sim_time: true
    target_frame: "utlidar_lidar"
    transform_tolerance: 1.0
    min_height: -0.1
    max_height: 0.1
    angle_min: -3.1415
    angle_max: 3.1415
    range_min: 0.2
    range_max: 10.0
    
    # This is the critical QoS setting that the relay node solves,
    # but we include it for completeness.
    qos_overrides:
      "/scan":
        publisher:
          reliability: "reliable"
