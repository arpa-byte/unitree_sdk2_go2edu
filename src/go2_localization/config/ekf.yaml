# Configuration for robot_localization EKF for Unitree Go2 with utlidar
ekf_filter_node:
  ros__parameters:
    # GENERAL PARAMETERS
    frequency: 30.0
    two_d_mode: true
    publish_acceleration: false
    publish_tf: true # This node WILL publish the odom->base_link transform

    # FRAME PARAMETERS
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom

    # SENSOR INPUT 1: ODOMETRY FROM odom_bridge_node
    # This provides linear X, Y, and angular Z velocities.
    odom0: /odom
    odom0_config: [false, false, false,  # X, Y, Z position
                   false, false, false,  # Roll, Pitch, Yaw orientation
                   true,  true,  false,  # VX, VY, VZ linear velocity
                   false, false, true,   # VRoll, VPitch, VYaw angular velocity
                   false, false, false]  # AX, AY, AZ linear acceleration
    odom0_differential: false

    # SENSOR INPUT 2: IMU FROM odom_bridge_node
    # We will get the IMU data from the SportModeState message.
    # We will fuse orientation and angular velocity.
    imu0: /imu/data
    imu0_config: [false, false, false,  # X, Y, Z position
                  true,  true,  false,  # Roll, Pitch, Yaw orientation
                  false, false, false,  # VX, VY, VZ linear velocity
                  true,  true,  true,   # VRoll, VPitch, VYaw angular velocity
                  false, false, false] # AX, AY, AZ linear acceleration
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
