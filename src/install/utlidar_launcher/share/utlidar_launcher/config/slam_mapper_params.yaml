slam_toolbox:
  ros__parameters:
    use_sim_time: false

    odom_frame: "odom"
    map_frame:  "map"
    base_frame: "base_link"
    scan_topic: "/scan_reliable"

    # Keep a generous TF history window (seconds)
    tf_buffer_duration: 30.0
    transform_timeout: 1.0

    # LiDAR specifics
    min_laser_range: 0.2
    max_laser_range: 10.0

    #mode: "mapping"
    mode: "localization"
    map_file_name: ""
    map_update_interval: 1.0
    resolution: 0.05
    minimum_travel_distance: 0.05
